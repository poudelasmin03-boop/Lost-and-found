

<style>
  * {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8fafc);
    color: #1e293b;
}

.login-main-container {
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
}

.logincontainer {
    position: relative;
    width: 100%;
    max-width: 440px;
    padding: 42px 38px 38px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.10),
        0 5px 15px rgba(15, 23, 42, 0.05);
    animation: loginCard 0.5s ease;
}

@keyframes loginCard {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.x-loginmark {
    position: absolute;
    top: 18px;
    right: 20px;
    width: 34px;
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    cursor: pointer;
    color: #64748b;
    background: #f8fafc;
    transition: all 0.25s ease;
}

.x-loginmark:hover {
    color: #ffffff;
    background: #ef4444;
    transform: rotate(90deg);
}

.registerh2 {
    margin: 0 0 30px;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #0f172a;
}

.registerh2::after {
    content: "";
    display: block;
    width: 45px;
    height: 4px;
    margin: 10px auto 0;
    border-radius: 10px;
    background: #2563eb;
}

.field {
    position: relative;
    margin-bottom: 22px;
}

.field label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #334155;
}

.field input {
    width: 100%;
    height: 50px;
    padding: 0 60px 0 15px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
    background: #ffffff;
    color: #0f172a;
    font-size: 14px;
    transition: 0.25s ease;
}

.field input::placeholder {
    color: #94a3b8;
}

.field input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
}
/* .password{
  position: relative;
} */

.loginshow1 {
    position: absolute;
    right: 14px;
    bottom: 14px;
    z-index: 5;
    font-size: 13px;
    font-weight: 600;
    color: #2563eb;
    cursor: pointer;
    user-select: none;
    background: transparent;
    transition: 0.2s ease;
}

.loginshow1:hover {
    color: #1d4ed8;
}

.loginusererr,
.loginpassworderr {
    margin: 6px 0 0;
    padding: 0;
    font-size: 13px;
    color: #dc2626;
}

.logincontainer p[style*="color: red"] {
    margin: 6px 0 0 !important;
    padding: 5px 0 !important;
    font-size: 13px;
    color: #dc2626 !important;
}

#submit {
    width: 100%;
    height: 50px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.22);
    transition: 0.2s ease;
}

#submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(37, 99, 235, 0.30);
}

#submit:active {
    transform: translateY(0);
}

#g_id_onload {
    margin-top: 8px;
}

.g_id_signin {
    width: 100% !important;
    margin: 18px 0 12px;
    display: flex;
    justify-content: center;
}

@media (max-width: 600px) {
    .login-main-container {
        padding: 20px 15px;
    }

    .logincontainer {
        padding: 38px 25px 30px;
        border-radius: 16px;
    }

    .registerh2 {
        font-size: 24px;
        margin-bottom: 25px;
    }

    .field input {
        height: 48px;
    }

    #submit {
        height: 48px;
    }
}

@media (max-width: 380px) {
    .logincontainer {
        padding: 35px 20px 25px;
    }

    .registerh2 {
        font-size: 22px;
    }

    .field label {
        font-size: 13px;
    }

    .field input {
        font-size: 13px;
    }
}
</style>
    <div class="login-main-container">
      <div class="logincontainer">
        <span class="x-loginmark">
          <i class="fa-solid fa-xmark"></i>
        </span>

        <h2 class="registerh2">Login Form</h2>

        <form
          onsubmit="return HandleLoginForm();"
          action="{% url 'login' %}"
          method="POST"
        >
          {% csrf_token %}

          <div class="field">
            <label> Username </label>

            <input
              type="text"
              name="username"
              id="loginusername"
              placeholder="Enter your username"
              value="{{username|default:''}}"
              autocomplete="username"
            />

            {% if login_usererror %}

            <p style="color: red; padding: 5px">{{login_usererror}}</p>

            {% endif %}

            <p class="loginusererr"></p>
          </div>

          <div class="field password">
            <label> Password </label>

            <input
              type="password"
              name="password"
              id="loginpassword"
              placeholder="Enter your password"
              autocomplete="current-password"

             
            />
              <span class="loginshow1" onclick="LoginshowPassword()"> Show </span>
              
          </div>
         <div id="g_id_onload"
     data-client_id="{{ google_client_id }}"
     data-context="signin"
     data-ux_mode="redirect"
     data-login_uri="http://localhost:8000/auth-receiver"
     data-itp_support="true">
</div>

<div class="g_id_signin"
     data-type="standard"
     data-shape="pill"
     data-theme="filled_blue"
     data-text="signin_with"
     data-size="large"
     data-logo_alignment="left">
</div>
          
            
             {% if error %}

            <p style="color: red; padding: 5px">{{error}}</p>

            {% endif %}
            <p class="loginpassworderr"></p>
            

          <input type="submit" id="submit" value="Submit" />
        </form>
      </div>
    </div>
